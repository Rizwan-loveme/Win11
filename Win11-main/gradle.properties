
# মেমোরি বাড়ানো হচ্ছে (native engine + Kotlin build-এর জন্য)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# আগের সেটিংসগুলো ঠিক রাখুন
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.enableAnnotationProcessorIncremental=true
android.enableAnnotationProcessorParallel=true
android.suppressUnsupportedCompileSdk=36,37,37.0
